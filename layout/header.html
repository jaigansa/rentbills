  <!-- Main Top Bar Header -->
  <header class="top-bar compact">
    <div class="top-bar-left">
      <div class="user-profile-badge icon-only" id="user-profile-badge" title="Admin">
        <div class="avatar-circle sync-indicator synced" id="user-avatar-text">A</div>
      </div>
    </div>
    <div class="top-bar-actions">
      <button id="theme-toggle-btn" class="circle-icon-btn" title="Toggle Theme (Dark / Light)" onclick="toggleTheme()">
        <i data-lucide="moon" id="theme-icon"></i>
      </button>
      <button id="lang-switch-btn" class="circle-icon-btn" title="Switch Language (English / தமிழ்)">
        <i data-lucide="globe"></i>
      </button>
      <button id="top-menu-btn" class="circle-icon-btn" title="Open Navigation Menu" aria-label="Open Navigation Menu" onclick="toggleMobileMenu()">
        <i data-lucide="menu" id="top-menu-icon"></i>
      </button>
    </div>
  </header>
