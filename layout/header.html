  <!-- Main Top Bar Header -->
  <header class="top-bar compact">
    <div class="top-bar-actions">
      <div class="user-profile-badge icon-only" id="user-profile-badge" title="Admin">
        <div class="avatar-circle" id="user-avatar-text">A</div>
      </div>
      <button id="theme-toggle-btn" class="btn btn-secondary btn-icon-only" title="Toggle Theme (Dark / Light)" onclick="toggleTheme()">
        <i data-lucide="moon" id="theme-icon"></i>
      </button>
      <button id="lang-switch-btn" class="btn btn-secondary btn-icon-only" title="Switch Language (English / தமிழ்)">
        <i data-lucide="globe"></i>
      </button>
      <div class="sync-badge icon-only" title="Online • Synced">
        <span class="status-dot online"></span>
      </div>
    </div>
  </header>
