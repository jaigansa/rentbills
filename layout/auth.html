  <!-- 0. INITIAL SESSION LOADER -->
  <div id="app-loader" class="auth-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;">
    <div class="auth-logo">RentBill Pro</div>
    <div class="sync-badge compact" style="background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); color: #fff;">
      <span class="status-dot online"></span>
      <span>Authenticating workspace...</span>
    </div>
  </div>

  <!-- 1. AUTHENTICATION VIEW -->
  <div id="auth-view" class="auth-container" style="display: none;">
    <!-- Top Floating Actions (Theme & Language) -->
    <div class="auth-top-actions">
      <button class="btn btn-secondary btn-icon-only" onclick="toggleTheme()" title="Toggle Theme (Dark / Light)">
        <i data-lucide="moon" id="login-theme-icon"></i>
      </button>
      <button id="login-lang-btn" class="btn btn-secondary btn-icon-only" onclick="document.getElementById('lang-switch-btn').click()" title="Switch Language">
        <i data-lucide="globe"></i>
      </button>
    </div>

    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand-badge">
          <i data-lucide="building-2"></i>
        </div>
        <h1 class="auth-logo" id="i18n-login-title">RentBill Pro</h1>
        <p class="auth-subtitle" id="i18n-login-subtitle">Smart Property & Rental Management System</p>
      </div>

      <form id="login-form">
        <!-- Email / Mobile Input Group -->
        <div class="form-group auth-input-group">
          <label for="login-email" id="i18n-label-email">Email Address or Mobile Number</label>
          <div class="input-icon-wrapper">
            <i data-lucide="mail" class="input-leading-icon"></i>
            <input type="text" id="login-email" class="form-control" placeholder="Email or Mobile" required autocomplete="username">
          </div>
        </div>

        <!-- Password Input Group -->
        <div class="form-group auth-input-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label for="login-password" id="i18n-label-password" style="margin-bottom: 0;">Password</label>
            <a href="javascript:void(0)" onclick="openForgotPasswordModal()" class="auth-forgot-link">Forgot password?</a>
          </div>
          <div class="input-icon-wrapper">
            <i data-lucide="lock" class="input-leading-icon"></i>
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="input-trailing-btn" onclick="toggleLoginPasswordMask()" title="Show/Hide Password" aria-label="Toggle Password Visibility">
              <i data-lucide="eye" id="login-eye-icon"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary auth-submit-btn" id="i18n-btn-login">
          <span>Sign In</span>
          <i data-lucide="arrow-right"></i>
        </button>
      </form>

      <!-- Error Message Banner -->
      <div id="login-error" class="auth-error-banner" style="display: none;">
        <i data-lucide="alert-circle"></i>
        <span id="login-error-text"></span>
      </div>

      <!-- Footer & Configure API Keys -->
      <div class="auth-footer">
        <button type="button" class="auth-config-link" onclick="showSetupConfigModal()">
          <i data-lucide="key-round"></i>
          <span>Configure Supabase Project Keys</span>
        </button>
        <div class="auth-security-badge">
          <i data-lucide="shield"></i>
          <span>256-Bit SSL Encrypted • Supabase Cloud</span>
        </div>
      </div>
    </div>
  </div>
