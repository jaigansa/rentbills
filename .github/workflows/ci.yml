name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'

      - name: Run test suite
        run: npm test

      - name: Syntax-check app JavaScript
        run: npm run check
